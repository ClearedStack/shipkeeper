name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go fmt, vet, race and Contract v1 replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify git-http-backend is present
        run: test -x /usr/lib/git-core/git-http-backend

      - name: Check gofmt, go vet and go test -race
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v -race -count=1 ./...
